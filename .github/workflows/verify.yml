name: Verify skill and distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check allowed source files
        run: python scripts/check_distribution.py
      - name: Verify builder and distribution boundaries
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify JavaScript behavior
        run: |
          node --check screenshot-review/assets/review.js
          node --check screenshot-review/assets/review-state.js
          node --test tests/test_review_state.cjs
      - name: Build and check the install archive
        run: python scripts/build_release.py
